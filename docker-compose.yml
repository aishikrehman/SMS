# Dhee SMS with Docker Compose (optional; see DEPLOY.md → Docker).
#
#   SQLite (default):        docker compose up -d
#   with PostgreSQL:         docker compose --profile postgres up -d
#                            and set DB_DRIVER=postgres + DATABASE_URL in .env (see below)
#
# Data, backups and logs live in named volumes and survive container updates.
# Put Caddy or nginx in front for HTTPS (DEPLOY.md), and keep TRUST_PROXY=true then.
services:
  app:
    build: .
    image: dhee-sms:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"
      SQLITE_PATH: /app/data/dhee.sqlite
      BACKUP_DIR: /app/backups
      LOG_DIR: /app/logs
      TRUST_PROXY: ${TRUST_PROXY:-true}
      # For PostgreSQL (profile "postgres"):
      # DB_DRIVER: postgres
      # DATABASE_URL: postgres://dhee:${POSTGRES_PASSWORD}@db:5432/dhee
    ports:
      - "127.0.0.1:3000:3000"      # only the local reverse proxy reaches it
    volumes:
      - dhee-data:/app/data
      - dhee-backups:/app/backups
      - dhee-logs:/app/logs
    stop_grace_period: 20s

  db:
    image: postgres:16-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: dhee
      POSTGRES_USER: dhee
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - dhee-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dhee -d dhee"]
      interval: 10s
      retries: 5

volumes:
  dhee-data:
  dhee-backups:
  dhee-logs:
  dhee-pg:
